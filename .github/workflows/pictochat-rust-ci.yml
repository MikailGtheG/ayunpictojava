name: PictoChat Rust relay CI

on:
  push:
    branches:
      - development/pictochat-modernization
    paths:
      - 'server/**'
      - '.github/workflows/pictochat-rust-ci.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/pictochat-rust-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
