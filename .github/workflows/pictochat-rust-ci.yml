name: PictoChat Rust relay CI

on:
  push:
    branches:
      - development/pictochat-modernization
    paths:
      - 'server/**'
      - '.github/workflows/pictochat-rust-ci.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/pictochat-rust-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Apply rustfmt in CI workspace
        run: cargo fmt --all
      - name: Test
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Browser crypto and UI tests
        run: |
          node --version
          node --check public/crypto.mjs
          node --test tests/*.test.mjs
