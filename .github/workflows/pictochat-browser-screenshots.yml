name: PictoChat visual and PDF acceptance
on:
  push:
    branches:
      - development/pictochat-modernization
    paths:
      - 'server/**'
      - 'frontend/**'
      - '.github/workflows/pictochat-browser-screenshots.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'frontend/**'
      - '.github/workflows/pictochat-browser-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pictochat-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build local Rust relay
        run: cargo build --bin pictochat-relay
      - name: Test browser and generate screenshots and PDF
        env:
          PICTOCHAT_RELAY_SECRET: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
        run: |
          set -euo pipefail
          mkdir -p screenshots
          target/debug/pictochat-relay > screenshots/relay.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:8787/ >/dev/null; then
              node tests/browser-visual.mjs
              exit 0
            fi
            sleep 1
          done
          cat screenshots/relay.log
          exit 1
      - name: Verify rendered A4 PDF and produce page preview
        run: |
          set -euo pipefail
          if ! command -v pdfinfo >/dev/null || ! command -v pdftoppm >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi
          test -s screenshots/pictochat-print-demo.pdf
          pdfinfo screenshots/pictochat-print-demo.pdf > screenshots/pdfinfo.txt
          grep -Eq 'Pages: +1' screenshots/pdfinfo.txt
          grep -Eq 'Page size: +59[0-9].*84[0-9].*pts' screenshots/pdfinfo.txt
          pdftotext -layout screenshots/pictochat-print-demo.pdf screenshots/print-text.txt
          grep -q 'PictoChat' screenshots/print-text.txt
          grep -q 'Merhaba' screenshots/print-text.txt
          grep -q 'Hallo' screenshots/print-text.txt
          if grep -Eq 'Einladungstoken|Separater Chat-Schlüssel|trusted-fingerprints' screenshots/print-text.txt; then
            echo 'Session secrets appeared in printable content' >&2
            exit 1
          fi
          pdftoppm -f 1 -l 1 -r 120 -singlefile -png screenshots/pictochat-print-demo.pdf screenshots/pictochat-print-preview
          test -s screenshots/pictochat-print-preview.png
          echo 'Validated rendered, searchable one-page A4 PDF.'
      - name: Upload visual proofs and logs
        if: always()
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: pictochat-visual-pdf-${{ github.run_id }}
          path: |
            server/screenshots/*.png
            server/screenshots/*.pdf
            server/screenshots/pdfinfo.txt
            server/screenshots/print-text.txt
            server/screenshots/relay.log
          retention-days: 14
          if-no-files-found: warn
      - name: Publish review links
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          {
            echo '## PictoChat visual and PDF acceptance'
            echo ''
            echo 'Download the original lobby, stage, desktop/mobile screenshots, A4 PDF and its independently rendered PNG preview:'
            echo ''
            echo "[Download screenshots and verified PDF](${ARTIFACT_URL})"
            echo ''
            echo 'The original DS interface is unchanged by print styling. The PDF uses a separate paginated DOM, with no room credentials.'
          } >> "$GITHUB_STEP_SUMMARY"
